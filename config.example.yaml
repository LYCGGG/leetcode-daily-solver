# LeetCode Daily Solver Configuration

# AI Configuration
ai:
  provider: openai  # openai, claude
  model: qwen3.8-max-preview
  api_key: ""  # Or set OPENAI_API_KEY / ANTHROPIC_API_KEY env var
  # base_url: https://api.openai.com/v1  # Optional custom endpoint

# LeetCode Configuration
leetcode:
  site: cn  # cn (leetcode.cn) or global (leetcode.com)
  session: ""  # LEETCODE_SESSION cookie value
  csrf_token: ""  # csrftoken cookie value

# Schedule Configuration
schedule:
  enabled: false
  time: "08:00"  # HH:MM format

# Solver Configuration
language: python3  # python3, cpp, java, etc.
max_retries: 5  # Max retries for code generation
log_level: INFO  # DEBUG, INFO, WARNING, ERROR
num_generated_cases: 5  # 差分测试额外用例数 (0 关闭差分测试)

# Storage Configuration
save_problems: true  # Save problems and solutions to files
problems_dir: "problems"  # Directory to save problems (format: {id:04d}_{title-slug})
